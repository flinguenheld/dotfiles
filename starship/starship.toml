# starship.toml

palette = "generated"
add_newline = false

format = """
$username\
[](bg:bg_ip bg_user)\
$localip\
[](bg:bg_git bg_ip)\
$git_branch\
$git_status\
$git_metrics\
[](bg:bg_code bg_git)\
$rust\
$c\
$lua\
$python\
[](bg:bg_dir bg_code)\
$directory\
[](bg:bg_status bg_dir)\
$cmd_duration\
$status\
$jobs\
[ ](bg:bg_transparent bg_status)\
"""

[username]
show_always = true
style_user = "bg:bg_user fg_user bold"
style_root = "bg:red fg_user bold"
format = '[ $user ]($style)'
disabled = false

[localip]
ssh_only = true
style = "bg:bg_ip fg_ip bold"
format = '[ @$localipv4 ]($style)'
disabled = false

[directory]
style = "bg:bg_dir fg_dir"
format = '[ $symbol($path) ]($style)'
truncation_length = 4
fish_style_pwd_dir_length = 1
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
style = "bg:bg_git fg_git"
symbol = " "
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:bg_git fg_git bold"
format = '([\[$all_status$ahead_behind\] ]($style))'

[git_metrics]
added_style = "bg:bg_git fg_git"
deleted_style = "bg:bg_git fg_git"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'
disabled = false

[rust]
style = "bg:bg_code fg_rust"
symbol = '󱘗 '
format = '[ $symbol($version) ]($style)'

[c]
style = "bg:bg_code fg_c"
symbol = " "
format = '[ $symbol($version(-$name)) ]($style)'
detect_extensions = ['c', 'h', 'cpp', 'cxx', 'cc']

[lua]
style = "bg:bg_code fg_lua"
symbol = " "
format = '[ $symbol($version) ]($style)'

[python]
style = "bg:bg_code fg_python"
symbol = " "
format = '[ $symbol${pyenv_prefix}(${version}) [(\($virtualenv\) )](bg:bg_code yellow bold)]($style)'
detect_files = [
  '.python-version',
  'Pipfile',
  '__init__.py',
  'pyproject.toml',
  'requirements.txt',
  'setup.py',
] # Remove tox.ini

[cmd_duration]
style = "bg:bg_status fg_duration"
format = '[ 󰔛 $duration ]($style)'

[status]
disabled = false
style = "bg:bg_status fg_status bold"
format = '[ $symbol$status ]($style)'

[jobs]
style = "bg:bg_status fg_job bold"
format = '[ $symbol $number ]($style)'

# GENERATED BY theme_apply from palette.toml (everforest_dark), do not edit below
[palettes.generated]
bg_user = "#e69875"
bg_ip = "#d3c6aa"
bg_git = "#7fbbb3"
bg_dir = "#83c092"
bg_code = "#343f44"
bg_status = "#343f44"
bg_transparent = "#FF000000"

fg_user = "#2d353b"
fg_ip = "#2d353b"
fg_git = "#2d353b"
fg_dir = "#2d353b"
fg_rust = "#e67e80"
fg_c = "#d699b6"
fg_lua = "#d699b6"
fg_python = "#7fbbb3"
fg_duration = "#7fbbb3"
fg_status = "#e67e80"
fg_job = "#dbbc7f"
