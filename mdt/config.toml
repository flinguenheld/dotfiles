# General settings (keys and options: md-tui README, Configuration)
width = 120                       # text column, centered below
alignment = "left"
gitignore = true                  # hide target/ etc. in the file tree
document_header = true            # path of the current document
file_tree_directory_header = true # browsed folder in the file tree
position_cache_ttl_minutes = 0    # always reopen where I left off

