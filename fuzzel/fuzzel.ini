# Colors: written by theme_apply from ~/.config/theme/palette.toml
include = ~/.config/fuzzel/palette.ini

[main]
font = JetBrainsMono:size=15
prompt = "  "
width = 40
horizontal-pad = 40
vertical-pad = 40
inner-pad = 30
line-height = 35
letter-spacing = 0.5
icons-enabled = yes
use-bold = true

[border]
width = 12
radius = 25
